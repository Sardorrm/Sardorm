name: Godot Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  project-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project files and puzzle data
        run: |
          test -f project.godot
          test -f src/main.gd
          test -f src/puzzle_engine.gd
          test -f src/puzzle_definition.gd
          test -f src/puzzle_repository.gd
          test -f src/level_manager.gd
          test -f src/save_manager.gd
          test -f src/stats_manager.gd
          test -f src/game_session.gd
          test -f src/game_rules.gd
          test -f src/difficulty_manager.gd
          test -f src/achievement_manager.gd
          test -f src/event_tracker.gd
          test -f src/puzzle_result.gd
          test -f src/progression_service.gd
          test -f src/answer_input_factory.gd
          test -f src/MainScene.tscn
          python3 -m json.tool data/puzzles.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/puzzles.json').read_text())
          puzzles = data.get('puzzles', [])
          assert len(puzzles) >= 35
          required = {'id','category','difficulty','prompt','answer','hint'}
          assert all(required <= p.keys() for p in puzzles)
          ids = [p['id'] for p in puzzles]
          assert len(ids) == len(set(ids))
          assert all(1 <= int(p['difficulty']) <= 5 for p in puzzles)
          types = {p.get('answer_type', 'number' if isinstance(p['answer'], (int, float)) else 'text') for p in puzzles}
          assert {'number', 'text', 'choice', 'true_false'} <= types
          assert all(p.get('explanation', '').strip() for p in puzzles)
          print(f'Validated {len(puzzles)} puzzles, all answer types, and learning explanations')
          PY
      - name: Parse project with Godot
        run: |
          docker run --rm -v "$PWD:/project" barichello/godot-ci:4.3.0 godot --headless --path /project --editor --quit
