name: Godot Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  project-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate project files and puzzle data
        run: |
          set -e
          for f in project.godot src/main.gd src/puzzle_engine.gd src/puzzle_definition.gd src/puzzle_repository.gd src/level_manager.gd src/save_manager.gd src/stats_manager.gd src/game_session.gd src/game_rules.gd src/difficulty_manager.gd src/achievement_manager.gd src/event_tracker.gd src/puzzle_result.gd src/progression_service.gd src/answer_input_factory.gd src/puzzle_interaction.gd src/daily_challenge.gd src/daily_challenge_service.gd src/life_manager.gd src/streak_manager.gd src/ui_polish.gd src/MainScene.tscn data/puzzles.json data/puzzles_extra.json; do test -f "$f"; done
          python3 -m json.tool data/puzzles.json >/dev/null
          python3 -m json.tool data/puzzles_extra.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = json.loads(Path('data/puzzles.json').read_text())
          extra = json.loads(Path('data/puzzles_extra.json').read_text())
          puzzles = base.get('puzzles', []) + extra.get('puzzles', [])
          assert len(puzzles) >= 100
          required = {'id','category','difficulty','prompt','answer','hint'}
          assert all(required <= p.keys() for p in puzzles)
          ids = [p['id'] for p in puzzles]
          prompts = [p['prompt'].strip().lower() for p in puzzles]
          assert len(ids) == len(set(ids))
          assert len(prompts) == len(set(prompts))
          assert all(1 <= int(p['difficulty']) <= 5 for p in puzzles)
          types = {p.get('answer_type', 'number' if isinstance(p['answer'], (int, float)) else 'text') for p in puzzles}
          assert {'number', 'text', 'choice', 'true_false'} <= types
          assert all(p.get('explanation', '').strip() for p in puzzles)
          assert all(isinstance(p.get('tags', []), list) for p in puzzles)
          assert sum(1 for p in puzzles if int(p['difficulty']) == 5) >= 10
          print(f'Validated {len(puzzles)} combined puzzles and gameplay content contracts')
          PY
      - name: Validate deterministic release version
        run: python3 scripts/validate_versioning.py
      - name: Run deterministic Python test suite
        env:
          PYTHONHASHSEED: '0'
        run: python scripts/run_tests.py
      - name: Audit Android export configuration
        run: python3 scripts/validate_android_export.py
      - name: Parse project with Godot
        run: |
          set -e
          docker pull barichello/godot-ci:4.3
          docker run --rm -v "$PWD:/project" barichello/godot-ci:4.3 godot --headless --path /project --editor --quit
      - name: Boot MindShift headless smoke test
        run: |
          set -e
          timeout 8s docker run --rm -v "$PWD:/project" barichello/godot-ci:4.3 godot --headless --path /project --quit-after 3 2>&1 | tee /tmp/mindshift-runtime.log
          test -s /tmp/mindshift-runtime.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR: Failed to load script|Could not load puzzle|Could not load puzzle repository" /tmp/mindshift-runtime.log
