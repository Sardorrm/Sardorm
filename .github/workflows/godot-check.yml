name: Godot Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  project-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate project files and puzzle data
        run: |
          set -e
          for f in project.godot src/main.gd src/puzzle_engine.gd src/puzzle_definition.gd src/puzzle_repository.gd src/level_manager.gd src/save_manager.gd src/stats_manager.gd src/game_session.gd src/game_rules.gd src/difficulty_manager.gd src/achievement_manager.gd src/event_tracker.gd src/puzzle_result.gd src/progression_service.gd src/answer_input_factory.gd src/puzzle_interaction.gd src/daily_challenge.gd src/daily_challenge_service.gd src/life_manager.gd src/streak_manager.gd src/MainScene.tscn; do test -f "$f"; done
          python3 -m json.tool data/puzzles.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('data/puzzles.json').read_text())
          puzzles = data.get('puzzles', [])
          assert len(puzzles) >= 35
          required = {'id','category','difficulty','prompt','answer','hint'}
          assert all(required <= p.keys() for p in puzzles)
          ids = [p['id'] for p in puzzles]
          prompts = [p['prompt'].strip().lower() for p in puzzles]
          assert len(ids) == len(set(ids))
          assert len(prompts) == len(set(prompts))
          assert all(1 <= int(p['difficulty']) <= 5 for p in puzzles)
          types = {p.get('answer_type', 'number' if isinstance(p['answer'], (int, float)) else 'text') for p in puzzles}
          assert {'number', 'text', 'choice', 'true_false'} <= types
          assert all(p.get('explanation', '').strip() for p in puzzles)
          assert all(isinstance(p.get('tags', []), list) for p in puzzles)
          print(f'Validated {len(puzzles)} puzzles and gameplay content contracts')
          PY
      - name: Run Python integrity tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Parse project with Godot
        run: |
          docker run --rm -v "$PWD:/project" barichello/godot-ci:4.3.0 godot --headless --path /project --editor --quit
